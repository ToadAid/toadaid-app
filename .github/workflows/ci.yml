name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    name: verify pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Stage C-P5 observation-age classifier
        run: npm run test:stage-c-p5

      - name: Verify Stage C-P6 target comparison
        run: npm run test:stage-c-p6

      - name: Verify Stage C-P7 full-HEAD target comparison
        run: npm run test:stage-c-p7

      - name: Verify Stage C-P8 configured-origin target comparison
        run: npm run test:stage-c-p8

      - name: Verify Stage C-P9 STDIO delivery admission
        run: npm run test:stage-c-p9

      - name: Verify Stage C-P10 cockpit fixture record
        run: npm run test:stage-c-p10

      - name: Verify Stage B2-P4B-P21 wallet-connect policy
        run: npm run test:stage-b2-p4b-p21

      - name: Verify Stage B2-P4B-P22 deed detail policy
        run: npm run test:stage-b2-p4b-p22

      - name: Verify Stage D-P0 agent presence projection
        run: npm run test:stage-d-p0

      - name: Verify Stage D-P1 agents view fixture record
        run: npm run test:stage-d-p1

      - name: Verify Stage D-P2 observation intake seam
        run: npm run test:stage-d-p2

      - name: Verify Stage D-P3 channel establishment ceremony
        run: npm run test:stage-d-p3

      - name: Verify Stage D-P4 live observation admission
        run: npm run test:stage-d-p4

      - name: Verify Stage D-P5 local principal binding ceremony
        run: npm run test:stage-d-p5

      - name: Verify Stage D-P6 local principal authentication observation
        run: npm run test:stage-d-p6

      - name: Verify Stage D-P7 shell wiring
        run: npm run test:stage-d-p7

      - name: Verify Stage D-P8 local authentication mechanic
        run: npm run test:stage-d-p8

      - name: Verify Stage D-P9 PrincipalId issuance and ERC-8004 identity mapping
        run: npm run test:stage-d-p9

      - name: Verify Stage D-P10 private-read activation
        run: npm run test:stage-d-p10

      - name: Verify Stage D-P11 ERC-8004 onchain identity verification (offline structural)
        run: npm run test:stage-d-p11

      - name: Verify Stage D-P12 knowledge-forge surface binding and declared operational mode
        run: npm run test:stage-d-p12

      - name: Verify Stage D-P13 declared-mode advisory routing posture
        run: npm run test:stage-d-p13

      - name: Verify Stage D-P14 collaborative structural-read gate
        run: npm run test:stage-d-p14

      - name: Verify Stage D-P15 live authentication session establishment
        run: npm run test:stage-d-p15

      - name: Verify Stage D-P16 pond conversation lane
        run: npm run test:stage-d-p16

      - name: Verify Stage D-P17 pond delivery lane
        run: npm run test:stage-d-p17

      - name: Verify Stage D-P18 pond dispatch lane
        run: npm run test:stage-d-p18

      - name: Verify Stage D-P19 pond delivery receipt lane
        run: npm run test:stage-d-p19

      - name: Verify Stage D-P20 pond message transport lane
        run: npm run test:stage-d-p20

      - name: Verify Stage D-P21 pond agent reply lane
        run: npm run test:stage-d-p21

      - name: Verify Stage D-P22 pond voice lane
        run: npm run test:stage-d-p22

      - name: Check committed diff whitespace
        shell: bash --noprofile --norc {0}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"

  verify-main:
    if: github.event_name == 'push'
    name: verify trusted main push
    runs-on: [self-hosted, Linux, X64, toadaid-app, hp]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Stage C-P5 observation-age classifier
        run: npm run test:stage-c-p5

      - name: Verify Stage C-P6 target comparison
        run: npm run test:stage-c-p6

      - name: Verify Stage C-P7 full-HEAD target comparison
        run: npm run test:stage-c-p7

      - name: Verify Stage C-P8 configured-origin target comparison
        run: npm run test:stage-c-p8

      - name: Verify Stage C-P9 STDIO delivery admission
        run: npm run test:stage-c-p9

      - name: Verify Stage C-P10 cockpit fixture record
        run: npm run test:stage-c-p10

      - name: Verify Stage B2-P4B-P21 wallet-connect policy
        run: npm run test:stage-b2-p4b-p21

      - name: Verify Stage B2-P4B-P22 deed detail policy
        run: npm run test:stage-b2-p4b-p22

      - name: Verify Stage D-P0 agent presence projection
        run: npm run test:stage-d-p0

      - name: Verify Stage D-P1 agents view fixture record
        run: npm run test:stage-d-p1

      - name: Verify Stage D-P2 observation intake seam
        run: npm run test:stage-d-p2

      - name: Verify Stage D-P3 channel establishment ceremony
        run: npm run test:stage-d-p3

      - name: Verify Stage D-P4 live observation admission
        run: npm run test:stage-d-p4

      - name: Verify Stage D-P5 local principal binding ceremony
        run: npm run test:stage-d-p5

      - name: Verify Stage D-P6 local principal authentication observation
        run: npm run test:stage-d-p6

      - name: Verify Stage D-P7 shell wiring
        run: npm run test:stage-d-p7

      - name: Verify Stage D-P8 local authentication mechanic
        run: npm run test:stage-d-p8

      - name: Verify Stage D-P9 PrincipalId issuance and ERC-8004 identity mapping
        run: npm run test:stage-d-p9

      - name: Verify Stage D-P10 private-read activation
        run: npm run test:stage-d-p10

      - name: Verify Stage D-P11 ERC-8004 onchain identity verification (offline structural)
        run: npm run test:stage-d-p11

      - name: Verify Stage D-P12 knowledge-forge surface binding and declared operational mode
        run: npm run test:stage-d-p12

      - name: Verify Stage D-P13 declared-mode advisory routing posture
        run: npm run test:stage-d-p13

      - name: Verify Stage D-P14 collaborative structural-read gate
        run: npm run test:stage-d-p14

      - name: Verify Stage D-P15 live authentication session establishment
        run: npm run test:stage-d-p15

      - name: Verify Stage D-P16 pond conversation lane
        run: npm run test:stage-d-p16

      - name: Verify Stage D-P17 pond delivery lane
        run: npm run test:stage-d-p17

      - name: Verify Stage D-P18 pond dispatch lane
        run: npm run test:stage-d-p18

      - name: Verify Stage D-P19 pond delivery receipt lane
        run: npm run test:stage-d-p19

      - name: Verify Stage D-P20 pond message transport lane
        run: npm run test:stage-d-p20

      - name: Verify Stage D-P21 pond agent reply lane
        run: npm run test:stage-d-p21

      - name: Verify Stage D-P22 pond voice lane
        run: npm run test:stage-d-p22

      - name: Check committed diff whitespace
        shell: bash --noprofile --norc {0}
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          ZERO_SHA=0000000000000000000000000000000000000000
          if [[ "$PUSH_BEFORE_SHA" == "$ZERO_SHA" ]]; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git diff --check "$EMPTY_TREE" "$PUSH_AFTER_SHA"
          else
            git diff --check "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
          fi
