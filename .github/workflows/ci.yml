name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Check committed diff whitespace
        shell: bash --noprofile --norc {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            ZERO_SHA=0000000000000000000000000000000000000000
            if [[ "$PUSH_BEFORE_SHA" == "$ZERO_SHA" ]]; then
              EMPTY_TREE=$(git hash-object -t tree /dev/null)
              git diff --check "$EMPTY_TREE" "$PUSH_AFTER_SHA"
            else
              git diff --check "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
            fi
          fi
